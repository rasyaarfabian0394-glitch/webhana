<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Ucapan Terima Kasih</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 500px;
            width: 90%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .image-container {
            width: 100%;
            height: auto;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            display: block;
        }

        .content {
            padding: 25px;
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 24px;
        }

        p {
            color: #555;
            line-height: 1.6;
            font-style: italic;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .location {
            color: #3498db;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="image-container">
            <img src="IMG_20250511_094206.jpg" alt="Momen Bersama Keluarga">
        </div>
        <div class="content">
            <h2>Terima Kasih!</h2>
            <p>"Kebahagiaan itu sederhana, cukup bersama kalian di bawah langit yang cerah. Terima kasih untuk momen indah ini!"</p>
            
            <div class="footer">
                📍 <span class="location">Pantai Bebas, Parapat</span><br>
                Mei 2025
            </div>
        </div>
    </div>

</body>
</html>
